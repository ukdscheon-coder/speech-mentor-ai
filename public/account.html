<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speech Mentor AI | 내 계정</title><style>body{font:16px system-ui;background:#f7f8fc;color:#182236;margin:0}main{max-width:520px;margin:32px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 6px 30px #17233b15}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0 15px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{background:#4338ca;color:white;border:0;cursor:pointer}button.secondary{background:#475569}label{display:block;font-weight:600}#message{white-space:pre-wrap}section{margin-top:22px}a{color:#4338ca}</style><main><h1>내 발표 환경</h1><p>회원별 연습 기록과 발표 환경을 안전하게 관리합니다.</p><p><a href="/">← 발표 연습 화면</a></p><div id="message" role="status"></div><section id="login"><label>이메일<input id="email" type="email" autocomplete="email"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label><button id="signin">로그인</button><button id="signup" class="secondary">새 계정 만들기</button><p>가입 후 이메일 인증이 필요할 수 있습니다.</p></section><section id="account" hidden><p id="who"></p><button id="logout" class="secondary">로그아웃</button><h2>새 발표 환경 만들기</h2><label>환경 이름<input id="name" maxlength="80" placeholder="예: 투자자 발표"></label><label>사용자 유형<select id="role"><option value="student">학생</option><option value="employee">회사원</option><option value="founder">창업자 및 사업가</option><option value="educator">교육자</option><option value="other">기타</option></select></label><label>발표 목적<select id="purpose"><option value="class">학교 발표</option><option value="meeting">회사 회의</option><option value="marketing">마케팅 및 영업</option><option value="pitch">투자 유치</option><option value="teaching">강의 및 교육</option><option value="other">기타</option></select></label><label>발표 언어<select id="language"><option value="ko-KR">한국어</option><option value="en-GB">영어</option><option value="ja-JP">일본어</option><option value="zh-CN">중국어</option><option value="es-ES">스페인어</option><option value="fr-FR">프랑스어</option><option value="de-DE">독일어</option></select></label><fieldset><legend>개선 목표</legend><label><input type="checkbox" value="clarity" class="goal"> 명확한 전달</label><label><input type="checkbox" value="confidence" class="goal"> 안정적인 발표</label><label><input type="checkbox" value="persuasion" class="goal"> 설득력</label><label><input type="checkbox" value="qa" class="goal"> 질의응답</label><label><input type="checkbox" value="gesture" class="goal"> 제스처</label></fieldset><button id="save">내 환경 저장</button><h2>저장된 발표 환경</h2><div id="profiles"></div></section></main><script>
let config,session;const $=id=>document.getElementById(id),msg=s=>$('message').textContent=s;
async function init(){const r=await fetch('/api/auth-config');if(!r.ok){msg('인증 서비스 설정이 필요합니다.');return}config=await r.json();const raw=sessionStorage.getItem('speech_session');if(raw){try{session=JSON.parse(raw);await refresh()}catch{session=null}}render()}
async function auth(path,body){const r=await fetch(config.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:config.anonKey,'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'인증 오류');return d}
function render(){$('login').hidden=!!session;$('account').hidden=!session;if(session)$('who').textContent=session.user?.email||''}
async function refresh(){if(!session?.refresh_token)return;const d=await auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token});session=d;sessionStorage.setItem('speech_session',JSON.stringify(d))}
async function api(path,opts={}){if(session.expires_at&&Date.now()/1000>session.expires_at-60)await refresh();const r=await fetch(path,{...opts,headers:{authorization:'Bearer '+session.access_token,'content-type':'application/json',...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d}
$('signup').onclick=async()=>{try{const d=await auth('signup',{email:$('email').value,password:$('password').value});msg(d.session?'가입 완료':'가입 요청 완료. 이메일 인증 링크를 확인하세요.')}catch(e){msg(e.message)}};
$('signin').onclick=async()=>{try{session=await auth('token?grant_type=password',{email:$('email').value,password:$('password').value});sessionStorage.setItem('speech_session',JSON.stringify(session));render();await load();msg('로그인했습니다.')}catch(e){msg(e.message)}};
$('logout').onclick=()=>{session=null;sessionStorage.removeItem('speech_session');render();msg('로그아웃했습니다.')};
async function load(){const d=await api('/api/profile');$('profiles').replaceChildren();for(const p of d.profiles){const el=document.createElement('p');el.textContent=p.name+' | '+p.role+' | '+p.purpose+' | '+p.language;$('profiles').append(el)}}
$('save').onclick=async()=>{try{await api('/api/profile',{method:'POST',body:JSON.stringify({name:$('name').value,role:$('role').value,purpose:$('purpose').value,language:$('language').value,goals:[...document.querySelectorAll('.goal:checked')].map(x=>x.value)})});await load();msg('개인 발표 환경을 저장했습니다.')}catch(e){msg(e.message)}};
init().catch(e=>msg(e.message));
</script></html>
